services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iot-light-control-server
    ports:
      - "3099:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_BASE_URL=http://144.126.140.118:3099
      - CORS_ORIGIN=http://144.126.140.118:3099
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_LIGHT_TOPIC=iot-light-control/lights/state
      - MQTT_DEVICE_TOPIC=iot-light-control/device/status
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-light-control-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
